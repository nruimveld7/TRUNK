name: trunk

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      trunk:
        condition: service_healthy
    environment:
      TRUNK_HOSTNAME: ${TRUNK_HOSTNAME:-:80}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    security_opt: [no-new-privileges:true]
    logging: &default-logging
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

  trunk:
    build:
      context: .
      dockerfile: Dockerfile
    image: trunk:1.0.0
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3000'
      TRUNK_SITE_NAME: ${TRUNK_SITE_NAME:-Operations}
      TRUNK_SITE_DESCRIPTION: ${TRUNK_SITE_DESCRIPTION:-Central launcher for tools and applications}
      ORIGIN: ${ORIGIN:?Set the externally visible TRUNK origin in .env}
      AUTH_MODE: ${AUTH_MODE:?Set AUTH_MODE=entra in .env}
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:-}
      ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET:-}
      ENTRA_REDIRECT_URI: ${ENTRA_REDIRECT_URI:-}
      ENTRA_POST_LOGOUT_REDIRECT_URI: ${ENTRA_POST_LOGOUT_REDIRECT_URI:-}
      SESSION_SECRET: ${SESSION_SECRET:?Set a 32+ character SESSION_SECRET in .env}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-28800}
      DATABASE_PATH: /app/data/trunk.db
      APPLICATION_REGISTRY_PATH: /app/config/applications.yaml
      ENABLE_DEMO_APPS: ${ENABLE_DEMO_APPS:-false}
      HEALTH_DEFAULT_INTERVAL_SECONDS: ${HEALTH_DEFAULT_INTERVAL_SECONDS:-30}
      HEALTH_TIMEOUT_MS: ${HEALTH_TIMEOUT_MS:-5000}
    expose: ['3000']
    volumes:
      - ./data:/app/data
      - ./config/applications.yaml:/app/config/applications.yaml:ro
    networks: [edge]
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:3000/healthz']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp:size=16m, mode=1777]
    logging: *default-logging

networks:
  edge:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
